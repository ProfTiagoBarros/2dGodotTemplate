name: Setup Godot
description: Instala o Godot (Linux, headless) e, opcionalmente, os export templates, com cache e verificação SHA-512.

inputs:
  version:
    description: "Versão do Godot (ex.: 4.7.2)"
    required: true
  templates:
    description: "Baixar também os export templates (~1,3 GB, ficam em cache)"
    required: false
    default: "false"

runs:
  using: composite
  steps:
    - name: Cache do Godot
      uses: actions/cache@v6
      with:
        path: ~/godot-bin
        key: godot-bin-${{ inputs.version }}

    - name: Baixar Godot (com verificação SHA-512)
      shell: bash
      env:
        VERSION: ${{ inputs.version }}
      run: |
        set -euo pipefail
        if [ ! -x ~/godot-bin/godot ]; then
          BASE="https://github.com/godotengine/godot/releases/download/${VERSION}-stable"
          FILE="Godot_v${VERSION}-stable_linux.x86_64.zip"
          cd "$RUNNER_TEMP"
          curl -fsSL -o SHA512-SUMS.txt "$BASE/SHA512-SUMS.txt"
          curl -fsSL -o "$FILE" "$BASE/$FILE"
          # Falha o job se o arquivo não bater com o checksum oficial do release.
          grep -E " [ *]${FILE}\$" SHA512-SUMS.txt | sha512sum -c -
          mkdir -p ~/godot-bin
          unzip -q "$FILE" -d godot
          mv "godot/Godot_v${VERSION}-stable_linux.x86_64" ~/godot-bin/godot
          chmod +x ~/godot-bin/godot
        fi
        echo "$HOME/godot-bin" >> "$GITHUB_PATH"

    - name: Cache dos export templates
      if: inputs.templates == 'true'
      uses: actions/cache@v6
      with:
        path: ~/.local/share/godot/export_templates/${{ inputs.version }}.stable
        key: godot-templates-${{ inputs.version }}

    - name: Baixar export templates (com verificação SHA-512)
      if: inputs.templates == 'true'
      shell: bash
      env:
        VERSION: ${{ inputs.version }}
      run: |
        set -euo pipefail
        DIR="$HOME/.local/share/godot/export_templates/${VERSION}.stable"
        if [ ! -f "$DIR/version.txt" ]; then
          BASE="https://github.com/godotengine/godot/releases/download/${VERSION}-stable"
          FILE="Godot_v${VERSION}-stable_export_templates.tpz"
          cd "$RUNNER_TEMP"
          curl -fsSL -o SHA512-SUMS.txt "$BASE/SHA512-SUMS.txt"
          curl -fsSL -o "$FILE" "$BASE/$FILE"
          grep -E " [ *]${FILE}\$" SHA512-SUMS.txt | sha512sum -c -
          mkdir -p "$DIR"
          unzip -q "$FILE" -d templates
          mv templates/templates/* "$DIR/"
          rm -rf templates "$FILE"
        fi
